<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />
  <title>PinVerse</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <!-- 顶部插画：设备外观（拆解自 Figma「Group 9」，分层还原） -->
    <div class="hero">
      <div class="device">
        <!-- 底部投影 -->
        <div class="device__shadow"></div>

        <!-- 正面卡片底板 -->
        <div class="device__base"></div>

        <!-- 左侧谷子图片：徽章式谷子照片 -->
        <img class="device__photo" src="assets/avatar-ryo.png" alt="谷子照片" decoding="async" />

        <!-- 粉色外壳图层：卡片轮廓 + 粉色装饰条 + 贴纸光晕 + 功能图标 -->
        <img class="device__frame" src="assets/hero/shell-back.svg" alt="" aria-hidden="true" />
        <div class="device__bar device__bar--top"></div>
        <div class="device__bar device__bar--bottom"></div>
        <span class="device__dot device__dot--1"></span>
        <span class="device__dot device__dot--2"></span>
        <span class="device__dot device__dot--3"></span>
        <span class="device__dot device__dot--spark"></span>

        <svg class="device__icon device__icon--share" viewBox="0 0 5.61012 5.61012" fill="none" aria-hidden="true">
          <path d="M2.19637 1.0519H1.95288C1.26417 1.0519 0.919815 1.0519 0.705861 1.25729C0.491908 1.46269 0.491908 1.79327 0.491908 2.45443V3.38945C0.491908 4.0506 0.491908 4.38118 0.705861 4.58658C0.919815 4.79198 1.26417 4.79198 1.95288 4.79198H2.9362C3.62491 4.79198 3.96926 4.79198 4.18321 4.58658C4.32183 4.4535 4.37064 4.26788 4.38782 3.97384" stroke="#FFADF3" stroke-width="0.350633" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.77902 1.63623V0.900726C3.77902 0.855083 3.81757 0.818082 3.86512 0.818082C3.88793 0.818082 3.90983 0.82679 3.92599 0.842287L5.03214 1.90421C5.08728 1.95713 5.11823 2.0289 5.11823 2.10374C5.11823 2.17857 5.08728 2.25034 5.03214 2.30326L3.92599 3.36517C3.90983 3.38069 3.88793 3.38939 3.86512 3.38939C3.81757 3.38939 3.77902 3.35239 3.77902 3.30673V2.57125H3.06584C2.07455 2.57125 1.70931 3.38939 1.70931 3.38939V2.805C1.70931 2.1595 2.25439 1.63623 2.92678 1.63623H3.77902Z" stroke="#FFADF3" stroke-width="0.350633" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <div class="device__glow">
          <img class="device__sticker-img" src="assets/hero/sticker.png" alt="" aria-hidden="true" />
        </div>
        <div class="device__sticker">
          <img class="device__sticker-img" src="assets/hero/sticker.png" alt="" aria-hidden="true" />
        </div>

        <svg class="device__icon device__icon--heart" viewBox="0 0 9.3502 9.3502" aria-hidden="true">
          <path d="M4.21166 7.35063C3.11252 6.52867 0.934923 4.64963 0.934923 2.95866C0.934923 1.84099 1.75511 0.934945 2.88288 0.934945C3.46727 0.934945 4.05166 1.12974 4.83084 1.90892C5.61003 1.12974 6.19441 0.934945 6.7788 0.934945C7.90655 0.934945 8.72676 1.84099 8.72676 2.95866C8.72676 4.64963 6.54918 6.52867 5.45002 7.35063C5.08014 7.62721 4.58154 7.62721 4.21166 7.35063Z" fill="#FF0000" stroke="#FF0000" stroke-width="0.589063" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="device__icon device__icon--comment" viewBox="0 0 9.3502 9.3502" fill="none" aria-hidden="true">
          <path d="M0.779132 4.09071C0.779132 2.14275 2.3375 1.16877 4.67505 1.16877C7.0126 1.16877 8.57097 2.14275 8.57097 4.09071C8.57097 6.03867 7.0126 7.01265 4.67505 7.01265V8.18142C4.67505 8.18142 0.779132 7.01265 0.779132 4.09071Z" stroke="#141B34" stroke-width="0.584388" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.11666 3.31153H6.2334M3.11666 4.8699H4.67503" stroke="#141B34" stroke-width="0.584388" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="device__icon device__icon--bookmark" viewBox="0 0 9.3502 9.3502" fill="none" aria-hidden="true">
          <path d="M1.55845 7.0051V3.7819C1.55845 2.36637 1.55845 1.6586 2.01489 1.21885C2.47133 0.779106 3.20594 0.779106 4.67519 0.779106C6.14442 0.779106 6.87907 0.779106 7.33548 1.21885C7.79192 1.6586 7.79192 2.36637 7.79192 3.7819V7.0051C7.79192 7.90346 7.79192 8.35262 7.49085 8.5134C6.90774 8.82472 5.81404 7.78599 5.29464 7.47323C4.99341 7.29184 4.84279 7.20114 4.67519 7.20114C4.50759 7.20114 4.35697 7.29184 4.05574 7.47323C3.53633 7.78599 2.44262 8.82472 1.85955 8.5134C1.55845 8.35262 1.55845 7.90346 1.55845 7.0051Z" stroke="#141B34" stroke-width="0.584388" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <!-- 文本图层 -->
        <div class="device__text">
          <p id="deviceContentText"></p>
        </div>
      </div>
    </div>

    <!-- 标题行 -->
    <div class="app-header" id="deviceStatusHeader">
      <div class="app-header__side app-header__side--left">
        <!-- 在线状态 -->
        <span class="status-dot" id="deviceStatusDot"></span>
        <span id="deviceStatusText">--</span>
      </div>

      <div class="app-header__center">
        <span class="app-header__title" id="deviceStatusTitle">--</span>
        <div class="dots" id="deviceStatusDots">
          <span class="is-active"></span>
        </div>
      </div>

      <div class="app-header__side app-header__side--right">
        <span id="deviceStatusBattery">--</span>
        <!-- 电池 -->
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="8" width="15" height="8" rx="2.5" stroke="#000" stroke-width="1.4"/>
          <rect x="6" y="10" width="7" height="4" rx="1" fill="#000"/>
          <path d="M20.5 10.5C21.5 10.9 21.5 13.1 20.5 13.5V10.5Z" fill="#000"/>
        </svg>
      </div>
    </div>

    <!-- 主面板 -->
    <div class="panel">
      <div class="tabs">
        <span class="tabs__item is-active" data-tab="plan">计划</span>
        <span class="tabs__item" data-tab="role">角色</span>
        <span class="tabs__item" data-tab="settings">设置</span>
      </div>

      <div class="views">
        <!-- 视图：计划 -->
        <section class="view is-active" data-view="plan">
          <div class="plan-scroll">
            <div class="plan-list" id="planList">
              <div class="card card--plan is-hidden" id="planCard">
                <div class="card__text">
                  <div class="card__title">早报</div>
                  <div class="card__subtitle"></div>
                </div>
                <!-- 设置配置（滑块）图标：点击进入「具体日程」编辑界面 -->
                <a class="card__action" href="plan-edit.html?mode=edit" aria-label="具体日程设置" data-nav-link>
                  <svg class="icon" width="17" height="16" viewBox="0 0 17 16" fill="none">
                    <path d="M2 4.5H11" stroke="#333" stroke-width="1.3" stroke-linecap="round"/>
                    <path d="M15 4.5H16" stroke="#333" stroke-width="1.3" stroke-linecap="round"/>
                    <circle cx="13" cy="4.5" r="2" stroke="#333" stroke-width="1.3"/>
                    <path d="M1 11.5H4" stroke="#333" stroke-width="1.3" stroke-linecap="round"/>
                    <path d="M8 11.5H16" stroke="#333" stroke-width="1.3" stroke-linecap="round"/>
                    <circle cx="6" cy="11.5" r="2" stroke="#333" stroke-width="1.3"/>
                  </svg>
                </a>
              </div>
            </div>

            <div class="plan-empty is-visible" id="planEmpty">正在加载计划…</div>
          </div>

          <a class="pill-btn" href="plan-edit.html?mode=add" id="planAddLink" data-nav-link>新建计划</a>
        </section>

        <!-- 视图：角色 -->
        <section class="view" data-view="role">
          <div class="role-scroll">
            <div class="role-grid" id="characterList" aria-live="polite"></div>
            <div class="role-list-status is-visible" id="characterListStatus">正在加载角色…</div>
          </div>

          <a class="pill-btn" href="role-add.html" data-nav-link>添加角色</a>
        </section>

        <!-- 视图：设置 -->
        <section class="view" data-view="settings">
          <div class="setting-row">
            <span class="setting-row__label">设备名称</span>
            <input class="setting-input" type="text" placeholder="请输入" id="deviceNameInput" />
          </div>

          <div class="setting-row">
            <span class="setting-row__label">面板样式</span>
            <div class="dropdown" data-dropdown>
              <button class="dropdown__toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="dropdown__value">粉色</span>
                <svg class="dropdown__chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M4 6L8 10L12 6" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <ul class="dropdown__menu" role="listbox">
                <li class="dropdown__option is-selected" role="option" data-value="粉色">粉色</li>
              </ul>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-row__text">
              <span class="setting-row__label">飞书日历</span>
              <span class="setting-row__hint" id="feishuBoundAt"></span>
            </div>
            <button class="setting-btn" type="button" id="feishuBindBtn" disabled>加载中…</button>
          </div>

          <div class="setting-row">
            <span class="setting-row__label">配置新网络</span>
            <button class="setting-btn" type="button">配网</button>
          </div>

          <div class="setting-row">
            <span class="setting-row__label">重置设备</span>
            <button class="setting-btn setting-btn--danger" type="button">重置</button>
          </div>

          <div class="view__spacer"></div>

          <button class="pill-btn pill-btn--danger" type="button" id="unbindDeviceBtn">解绑设备</button>
        </section>
      </div>
    </div>

  </div>

  <!-- 解绑设备二次确认对话框 -->
  <div class="confirm-dialog" id="unbindConfirmDialog">
    <div class="confirm-dialog__backdrop" data-action="cancel"></div>
    <div class="confirm-dialog__box">
      <div class="confirm-dialog__content">
        <p class="confirm-dialog__text">确定要解绑此设备吗？</p>
        <p class="confirm-dialog__tip">提示：解绑设备后，需要重新配网才能再次使用。</p>
      </div>
      <div class="confirm-dialog__actions">
        <button class="confirm-dialog__btn confirm-dialog__btn--cancel" type="button" data-action="cancel">取消</button>
        <button class="confirm-dialog__btn confirm-dialog__btn--confirm" type="button" data-action="confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 解绑飞书日历二次确认对话框 -->
  <div class="confirm-dialog" id="feishuUnbindDialog">
    <div class="confirm-dialog__backdrop" data-action="cancel"></div>
    <div class="confirm-dialog__box">
      <div class="confirm-dialog__content">
        <p class="confirm-dialog__text">确定要解绑飞书日历吗？</p>
        <p class="confirm-dialog__tip">解绑后将无法同步日程。</p>
      </div>
      <div class="confirm-dialog__actions">
        <button class="confirm-dialog__btn confirm-dialog__btn--cancel" type="button" data-action="cancel">取消</button>
        <button class="confirm-dialog__btn confirm-dialog__btn--confirm" type="button" data-action="confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="toast.js"></script>
  <script src="dropdown.js"></script>
  <script src="device-status.js"></script>
  <script src="device-name.js"></script>
  <script src="device-content.js"></script>
  <script src="characters.js"></script>
  <script src="schedules.js"></script>
  <script src="feishu.js"></script>
  <script src="app.js"></script>
</body>
</html>
