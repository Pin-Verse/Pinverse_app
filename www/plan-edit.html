<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />
  <title>PinVerse · 计划</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="plan-edit.css" />
</head>
<body>
  <div class="plan-edit-screen">
    <div class="plan-edit__header">
      <button class="plan-edit__icon-btn" type="button" id="planEditBackBtn" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M10.5 6L5 12L10.5 18" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.5 12H19" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>

      <span class="plan-edit__title" id="planEditTitle">早报</span>

      <!-- 删除按钮：仅「编辑」入口（具体日程 · 设置配置）显示，「新增计划」入口不显示，由 plan-edit.js 按 ?mode= 控制 -->
      <button class="plan-edit__icon-btn plan-edit__icon-btn--danger" type="button" id="planEditDeleteBtn" aria-label="删除">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M5 7H19" stroke="#FF2B2B" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M9 7V5.5C9 4.67157 9.67157 4 10.5 4H13.5C14.3284 4 15 4.67157 15 5.5V7" stroke="#FF2B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7.5 7L8.1 18.2C8.15 19.19 8.97 20 9.97 20H14.03C15.03 20 15.85 19.19 15.9 18.2L16.5 7" stroke="#FF2B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 10.5V16.5" stroke="#FF2B2B" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M14 10.5V16.5" stroke="#FF2B2B" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="plan-edit__body">
      <div class="plan-edit__card">
        <div class="plan-edit__card-title" id="planEditCardTitle">早报</div>
        <div class="plan-edit__card-subtitle">AI 自动汇总天气&amp;日程信息，让你一眼 Get 今日重点</div>
      </div>

      <div class="plan-edit__card">
        <div class="plan-edit__row">
          <span class="plan-edit__row-label">所在地</span>
          <div class="dropdown" data-dropdown data-field="location">
            <button class="dropdown__toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="dropdown__value">杭州</span>
              <svg class="dropdown__chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 6L8 10L12 6" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <ul class="dropdown__menu" role="listbox">
              <li class="dropdown__option is-selected" role="option" data-value="杭州">杭州</li>
              <li class="dropdown__option" role="option" data-value="舟山">舟山</li>
              <li class="dropdown__option" role="option" data-value="宁波">宁波</li>
              <li class="dropdown__option" role="option" data-value="衢州">衢州</li>
              <li class="dropdown__option" role="option" data-value="台州">台州</li>
              <li class="dropdown__option" role="option" data-value="北美洲">北美洲</li>
            </ul>
          </div>
        </div>
        <div class="plan-edit__row">
          <span class="plan-edit__row-label">日历链接</span>
          <div class="dropdown" data-dropdown data-field="calendar">
            <button class="dropdown__toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="dropdown__value">请选择</span>
              <svg class="dropdown__chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 6L8 10L12 6" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <ul class="dropdown__menu" role="listbox">
              <li class="dropdown__option is-selected" role="option" data-value="请选择">请选择</li>
              <li class="dropdown__option" role="option" data-value="飞书">飞书</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="plan-edit__card">
        <div class="plan-edit__row-label plan-edit__section-label">显示日期</div>

        <div class="weekday-picker">
          <button class="weekday-picker__item" type="button" data-day="1">一</button>
          <button class="weekday-picker__item" type="button" data-day="2">二</button>
          <button class="weekday-picker__item" type="button" data-day="3">三</button>
          <button class="weekday-picker__item" type="button" data-day="4">四</button>
          <button class="weekday-picker__item" type="button" data-day="5">五</button>
          <button class="weekday-picker__item" type="button" data-day="6">六</button>
          <button class="weekday-picker__item" type="button" data-day="7">日</button>
        </div>

        <div class="time-range">
          <div class="dropdown" data-dropdown data-field="start-time">
            <button class="dropdown__toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="dropdown__value">8:00</span>
              <svg class="dropdown__chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 6L8 10L12 6" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <ul class="dropdown__menu" role="listbox">
              <li class="dropdown__option is-selected" role="option" data-value="8:00">8:00</li>
            </ul>
          </div>
          <span class="time-range__sep">～</span>
          <div class="dropdown" data-dropdown data-field="end-time">
            <button class="dropdown__toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="dropdown__value">8:00</span>
              <svg class="dropdown__chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 6L8 10L12 6" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <ul class="dropdown__menu" role="listbox">
              <li class="dropdown__option is-selected" role="option" data-value="8:00">8:00</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="plan-edit__spacer"></div>

      <p class="plan-edit__error" id="planEditError" role="alert" aria-live="polite"></p>
      <button class="pill-btn" type="button" id="planEditSubmitBtn">新增</button>
    </div>
  </div>

  <!-- 删除二次确认对话框 -->
  <div class="confirm-dialog" id="confirmDialog">
    <div class="confirm-dialog__backdrop" data-action="cancel"></div>
    <div class="confirm-dialog__box">
      <p class="confirm-dialog__text">是否删除？</p>
      <div class="confirm-dialog__actions">
        <button class="confirm-dialog__btn confirm-dialog__btn--cancel" type="button" data-action="cancel">取消</button>
        <button class="confirm-dialog__btn confirm-dialog__btn--confirm" type="button" data-action="confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="dropdown.js"></script>
  <script src="schedules.js"></script>
  <script src="plan-edit.js"></script>
</body>
</html>
