<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />
  <title>PinVerse · 角色管理</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="role-config.css" />
  <link rel="stylesheet" href="role-manage.css" />
</head>
<body>
  <div class="role-config-screen" id="roleManageScreen">
    <div class="role-config__header">
      <button class="role-config__icon-btn" type="button" id="roleManageBackBtn" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M10.5 6L5 12L10.5 18" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.5 12H19" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="role-config__body">
      <div class="role-config__intro">
        <p class="role-config__title">角色管理</p>
        <p class="role-config__subtitle">修改角色的信息和性格</p>
      </div>

      <div class="role-config__avatar">
        <img class="role-config__avatar-img" id="roleManageAvatar" src="assets/avatar-ryo.png" alt="角色头像" />
      </div>

      <div class="role-config__card" id="roleManageCard">
        <div class="setting-row">
          <span class="setting-row__label">角色名称</span>
          <input class="setting-input" type="text" id="roleManageName" placeholder="请输入" maxlength="50" disabled />
        </div>
        <div class="setting-row">
          <span class="setting-row__label">怎么称呼你</span>
          <input class="setting-input" type="text" id="roleManageCallMe" placeholder="请输入" maxlength="20" disabled />
        </div>
        <div class="setting-row">
          <span class="setting-row__label">口头禅（可选）</span>
          <input class="setting-input" type="text" id="roleManageCatchphrase" placeholder="请输入" maxlength="2000" disabled />
        </div>

        <div class="role-config__personality">
          <p class="role-config__personality-title">性格</p>
          <div class="personality-panel">
            <span class="personality-panel__axis personality-panel__axis--top">活泼外向</span>
            <span class="personality-panel__axis personality-panel__axis--bottom">内向收敛</span>
            <span class="personality-panel__axis personality-panel__axis--left">温柔</span>
            <span class="personality-panel__axis personality-panel__axis--right">冷酷</span>
            <div class="personality-panel__grid is-disabled" id="roleManagePersonalityGrid">
              <div class="personality-panel__handle" id="roleManagePersonalityHandle"></div>
            </div>
          </div>
        </div>

        <p class="role-config__error is-visible" id="roleManageStatus" role="status" aria-live="polite">正在加载角色…</p>
        <button class="pill-btn" type="button" id="roleManageSaveBtn" disabled>保存修改</button>
        <button class="pill-btn pill-btn--danger" type="button" id="roleManageDeleteBtn" disabled>删除角色</button>
      </div>
    </div>
  </div>

  <div class="confirm-dialog" id="roleDeleteDialog" role="dialog" aria-modal="true" aria-labelledby="roleDeleteDialogTitle">
    <div class="confirm-dialog__backdrop" data-action="cancel"></div>
    <div class="confirm-dialog__box">
      <div class="confirm-dialog__content">
        <p class="confirm-dialog__text" id="roleDeleteDialogTitle">确定要删除这个角色吗？</p>
        <p class="confirm-dialog__tip">删除后无法恢复。</p>
      </div>
      <div class="confirm-dialog__actions">
        <button class="confirm-dialog__btn confirm-dialog__btn--cancel" type="button" data-action="cancel">取消</button>
        <button class="confirm-dialog__btn confirm-dialog__btn--confirm role-delete-confirm" type="button" data-action="confirm">删除</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="role-manage.js"></script>
</body>
</html>
